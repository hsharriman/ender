# Standalone compose file — runs Ender without the private `geo-proof-dataset`
# repo / `proof_data` external volume. Only the proofs bundled in this repo
# under `src/checker/proofs/tests/` are available (the dataset volume is only
# used by the manual eval scripts in `backend/`, not by the running services).
#
# Usage:
#   docker compose -f docker-compose.standalone.yml build
#   docker compose -f docker-compose.standalone.yml up
services:
  checker:
    build:
      context: .
      dockerfile: Dockerfile.checker
    ports:
      - "4000:4000"
    networks:
      - ender

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - CHECKER_URL=http://checker:4000
    env_file:
      - .env
    volumes:
      - ./src/checker/proofs:/app/src/checker/proofs
      - ./src/checker/grammar/defs:/app/src/checker/grammar/defs
      - ./backend:/app/backend
    depends_on:
      - checker
    networks:
      - ender

  interface:
    build:
      context: .
      dockerfile: Dockerfile.interface
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - ender

networks:
  ender:
    driver: bridge
